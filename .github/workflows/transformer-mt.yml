name: Transformer MT CPU tests

on:
  push:
    paths:
      - 'Other_Courses/Transformer/Projects/Transformer_MT/**'
      - '.github/workflows/transformer-mt.yml'
  pull_request:
    paths:
      - 'Other_Courses/Transformer/Projects/Transformer_MT/**'
      - '.github/workflows/transformer-mt.yml'

permissions:
  contents: read

jobs:
  test:
    defaults:
      run:
        working-directory: Other_Courses/Transformer/Projects/Transformer_MT
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: Other_Courses/Transformer/Projects/Transformer_MT/requirements.txt
      - name: Install CPU dependencies
        run: |
          python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Run unit and workflow tests
        run: python -m unittest discover -s tests -v
